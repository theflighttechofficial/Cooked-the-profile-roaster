  <body>
    <noscript>
      <main>
        <h1>Get roasted by your own data</h1>
        <p>Cooked pulls your real public stats from 34 platforms, then an AI writes a roast built from them. Stack several profiles into one roast, battle a friend, or upload a screenshot. Save the result as an image and share it.</p>
        <h2>Supported platforms</h2>
        <ul>
          <li><strong>Code:</strong> GitHub, GitLab, Codeberg, Stack Overflow, npm, crates.io, Hugging Face, Docker Hub</li>
          <li><strong>Competitive programming and typing:</strong> LeetCode, Codeforces, AtCoder, Codewars, Monkeytype</li>
          <li><strong>Social and writing:</strong> Hacker News, Lobsters, DEV, Hashnode, Medium, Bluesky, Mastodon, Reddit, Wikipedia</li>
          <li><strong>Film, anime, music and books:</strong> Letterboxd, MyAnimeList, AniList, Last.fm, Discogs, Open Library</li>
          <li><strong>Games:</strong> Steam, Chess.com, Lichess, Duolingo, speedrun.com, Pokémon Showdown</li>
        </ul>
        <p>Cooked needs JavaScript to run. Turn it on to get roasted.</p>
      </main>
